name: Remove creatures and colour worker combat
on:
  push:
    branches: [main]
    paths: ['player-colours.js', '.github/workflows/remove-creatures.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Remove creature subsystem
        shell: python
        run: |
          from pathlib import Path
          path=Path('expansion.js')
          source=path.read_text(encoding='utf-8')
          marker='let animation=null,clock=null;'
          if source.count(marker)!=1: raise RuntimeError('Presentation boundary missing')
          prefix=r'''(()=>{
          function cleanVoyage(v){
            if(!v||!v.duelVersion)return v;
            const early=v.duelOver&&v.phase==='over'&&v.round<8;
            for(const k of Object.keys(v))if(k.startsWith('duel')||k==='pendingDuel')delete v[k];
            for(const p of v.players)for(const k of ['hp','mana','manaMax','army','colour'])delete p[k];
            if(early){v.phase='end';v.step='place';delete v.pending;}
            return v;
          }
          const oldRead=read;read=function(){return cleanVoyage(oldRead());};
          const oldRender=render;render=function(){if(s){cleanVoyage(s);if(s.phase==='over'&&s.players.some(p=>!Number.isFinite(p.total)))scoreFinal();}oldRender();};
          const oldOverlay=overlays;overlays=function(){let html=oldOverlay();if(s?.combat&&!s.combat.diceAnimated){html=html.replace('<div class="modal-grid">','<p role="status">Rolling the dice...</p><div class="modal-grid dice-rolling">').replace('<button data-combat="continue">','<button data-combat="continue" disabled>');queueMicrotask(()=>animate(s?.combat));}return html;};
          '''
          result=prefix+source[source.index(marker):]
          for forbidden in ['const roster=','data-exp=','function recruit(','function attack(']:
              if forbidden in result: raise RuntimeError('Creature code remains')
          path.write_text(result,encoding='utf-8')
          game=Path('watershallow.js')
          code=game.read_text(encoding='utf-8')
          modified='const target=Array.from({length:s.players.length-1},(_,i)=>(s.active+i+1)%s.players.length).find(i=>s.players[i].hp===undefined||s.players[i].hp>0)??s.active;'
          original='const target=(s.active+1)%s.players.length;'
          if modified in code: code=code.replace(modified,original,1)
          elif original not in code: raise RuntimeError('Order target anchor missing')
          game.write_text(code,encoding='utf-8')
          page=Path('index.html')
          text=page.read_text(encoding='utf-8')
          if '</body>' not in text: raise RuntimeError('Missing body')
          tag='<script src="player-colours.js"></script>'
          if tag not in text: text=text.replace('</body>',tag+'</body>',1)
          page.write_text(text,encoding='utf-8')
      - name: Validate scripts
        run: |
          node --check player-colours.js
          node --check expansion.js
          node --check watershallow.js
      - name: Commit installation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html expansion.js watershallow.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Remove creatures and enable player-coloured worker combat'
          git push origin HEAD:main
