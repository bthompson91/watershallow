name: Install Subway heading font
on:
  push:
    branches: [main]
    paths: ['.github/workflows/install-subway-font.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Download font and update headings
        shell: python
        run: |
          import html, io, re, zipfile
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urljoin, urlparse
          from urllib.request import Request, urlopen
          source = 'https://www.dafont.com/subway-ds.font'
          def fetch(url):
              with urlopen(Request(url, headers={'User-Agent': 'Mozilla/5.0 Watershallow font installer'}), timeout=60) as response:
                  data = response.read(10_000_001)
              if len(data) > 10_000_000:
                  raise RuntimeError('Download exceeds size limit')
              return data
          class Links(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.urls = []
              def handle_starttag(self, tag, attrs):
                  if tag == 'a':
                      href = dict(attrs).get('href', '')
                      url = urljoin(source, html.unescape(href))
                      if urlparse(url).hostname == 'dl.dafont.com':
                          self.urls.append(url)
          links = Links()
          links.feed(fetch(source).decode('utf-8', errors='replace'))
          if not links.urls:
              raise RuntimeError('No DaFont archive link found; no files changed')
          archive = zipfile.ZipFile(io.BytesIO(fetch(links.urls[0])))
          candidates = [x for x in archive.infolist() if re.sub('[^a-z]', '', Path(x.filename).stem.lower()) == 'subwayblack' and Path(x.filename).suffix.lower() == '.ttf']
          if len(candidates) != 1:
              raise RuntimeError('Expected exactly one Subway Black TTF')
          font = archive.read(candidates[0])
          if font[:4] not in (b'\x00\x01\x00\x00', b'OTTO', b'true'):
              raise RuntimeError('Invalid font signature')
          page = Path('index.html')
          content = page.read_text(encoding='utf-8')
          if '<style>' not in content:
              raise RuntimeError('Expected inline stylesheet not found')
          css = "@font-face{font-family:'Subway';src:url('./fonts/subway/Subway-Black.ttf') format('truetype');font-weight:400;font-style:normal;font-display:swap}\nh1,h2,h3,.brand,.quay-title,.map-caption{font-family:'Subway',Georgia,serif!important;font-weight:400!important;font-synthesis:none}\n.brand>span,.commission-badge{font-family:'Courier New',monospace}\n"
          content = content.replace('<style>', '<style>\n' + css, 1)
          content = content.replace('</body>', "<script>if(document.fonts&&typeof fitHands==='function'){document.fonts.ready.then(fitHands);document.fonts.addEventListener('loadingdone',fitHands);}</script></body>", 1)
          target = Path('fonts/subway')
          target.mkdir(parents=True, exist_ok=True)
          (target / 'Subway-Black.ttf').write_bytes(font)
          notices = [x for x in archive.infolist() if not x.is_dir() and Path(x.filename).suffix.lower() in ('.txt', '.md') and x.file_size < 200_000]
          for i, notice in enumerate(notices):
              (target / ('upstream-' + str(i) + '-' + Path(notice.filename).name)).write_bytes(archive.read(notice))
          (target / 'SOURCE.md').write_text('Subway by Dieter Steffmann.\nSource: ' + source + '\nDaFont labels this family 100% Free. Preserve any upstream notices. The game MIT licence does not relicense this font. This source note is not a substitute for font licence terms.\n', encoding='utf-8')
          page.write_text(content, encoding='utf-8')
      - name: Commit font installation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fonts/subway index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Install Subway Black font and apply heading typography'
          git push origin HEAD:main
