name: Install JuliaMetal ASCII font
on:
  push:
    branches: [main]
    paths: ['.github/workflows/install-juliametal.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Download font and update ASCII typography
        shell: python
        run: |
          import html, io, re, zipfile
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urljoin, urlparse
          from urllib.request import Request, urlopen
          source = 'https://www.dafont.com/juliametal.font'
          def fetch(url):
              with urlopen(Request(url, headers={'User-Agent': 'Mozilla/5.0 Watershallow font installer'}), timeout=60) as response:
                  data = response.read(10_000_001)
              if len(data) > 10_000_000:
                  raise RuntimeError('Download exceeds size limit')
              return data
          class Links(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.urls = []
              def handle_starttag(self, tag, attrs):
                  if tag == 'a':
                      url = urljoin(source, html.unescape(dict(attrs).get('href', '')))
                      if urlparse(url).hostname == 'dl.dafont.com':
                          self.urls.append(url)
          links = Links()
          links.feed(fetch(source).decode('utf-8', errors='replace'))
          if not links.urls:
              raise RuntimeError('No DaFont archive link found; no files changed')
          archive = zipfile.ZipFile(io.BytesIO(fetch(links.urls[0])))
          candidates = [x for x in archive.infolist() if re.sub('[^a-z]', '', Path(x.filename).stem.lower()) == 'juliametalregular' and Path(x.filename).suffix.lower() == '.ttf']
          if len(candidates) != 1 or candidates[0].file_size > 5_000_000:
              raise RuntimeError('Expected one JuliaMetal Regular TTF')
          font = archive.read(candidates[0])
          if font[:4] not in (b'\x00\x01\x00\x00', b'OTTO', b'true'):
              raise RuntimeError('Invalid font signature')
          page = Path('index.html')
          content = page.read_text(encoding='utf-8')
          if '</head>' not in content:
              raise RuntimeError('Page head not found')
          css = "@font-face{font-family:'JuliaMetal';src:url('./fonts/juliametal/JuliaMetal-Regular.ttf') format('truetype');font-weight:400;font-style:normal;font-display:swap}\npre,#terrain,.building-art,.sidebar-art,.menu pre,.compass{font-family:'JuliaMetal','Courier New',monospace!important;font-weight:400!important;font-variant-ligatures:none;letter-spacing:0}\n"
          content = re.sub(r'<style id="juliametal-font">.*?</style>', '', content, flags=re.S)
          content = content.replace('</head>', '<style id="juliametal-font">' + css + '</style></head>', 1)
          if 'data-juliametal-fit' not in content:
              content = content.replace('</body>', "<script data-juliametal-fit>if(document.fonts){const refresh=()=>{if(typeof paint==='function')paint();if(typeof fitHands==='function')fitHands();};document.fonts.ready.then(refresh);document.fonts.addEventListener('loadingdone',refresh);}</script></body>", 1)
          target = Path('fonts/juliametal')
          target.mkdir(parents=True, exist_ok=True)
          (target / 'JuliaMetal-Regular.ttf').write_bytes(font)
          notices = [x for x in archive.infolist() if not x.is_dir() and x.file_size < 200_000 and (Path(x.filename).suffix.lower() in ('.txt', '.md') or Path(x.filename).name.lower() in ('ofl', 'license', 'licence', 'copying'))]
          for i, notice in enumerate(notices):
              (target / ('upstream-' + str(i) + '-' + Path(notice.filename).name)).write_bytes(archive.read(notice))
          (target / 'SOURCE.md').write_text('JuliaMetal by cormullion.\nSource: ' + source + '\nDaFont labels this family 100% Free. Preserve upstream notices. The game MIT licence does not relicense this font. This source note is not a substitute for font licence terms.\n', encoding='utf-8')
          page.write_text(content, encoding='utf-8')
      - name: Commit font installation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fonts/juliametal index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Install JuliaMetal for monospace ASCII artwork'
          git push origin HEAD:main
