name: Fit map and simplify sea
on:
  push:
    branches: [main]
    paths: ['map-fit.js', '.github/workflows/install-map-fit.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Validate map fitting
        run: node --check map-fit.js
      - name: Reduce sea density and load fitting
        shell: python
        run: |
          from pathlib import Path
          atlas=Path('emoji-atlas.js')
          text=atlas.read_text(encoding='utf-8')
          old='for(let i=0;i<145;i++)'
          new='for(let i=0;i<45;i++)'
          if old in text: text=text.replace(old,new,1)
          elif new not in text: raise RuntimeError('Sea scenery loop not found')
          old="pattern=sea?' ~   ~~~   '"
          new="pattern=sea?' ~                     '"
          if old in text: text=text.replace(old,new,1)
          elif new not in text: raise RuntimeError('Sea terrain pattern not found')
          atlas.write_text(text,encoding='utf-8')
          page=Path('index.html')
          text=page.read_text(encoding='utf-8')
          if '</body>' not in text: raise RuntimeError('Missing body')
          tag='<script src="map-fit.js"></script>'
          if tag not in text: text=text.replace('</body>',tag+'</body>',1)
          page.write_text(text,encoding='utf-8')
      - name: Validate atlas
        run: node --check emoji-atlas.js
      - name: Commit map changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html emoji-atlas.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fit building district within map and reduce sea wave density'
          git push origin HEAD:main
