name: Install complete combat expansion
on:
  push:
    branches: [main]
    paths: ['expansion.js', '.github/workflows/install-expansion.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Validate expansion
        run: node --check expansion.js
      - name: Install expansion and eliminate invalid order targets
        shell: python
        run: |
          from pathlib import Path
          page=Path('index.html')
          text=page.read_text(encoding='utf-8')
          if '<script src="combat.js"></script>' not in text: raise RuntimeError('Existing worker combat required')
          if '</body>' not in text: raise RuntimeError('Missing body')
          tag='<script src="expansion.js"></script>'
          if tag not in text: text=text.replace('</body>',tag+'</body>',1)
          page.write_text(text,encoding='utf-8')
          game=Path('watershallow.js')
          code=game.read_text(encoding='utf-8')
          old='const target=(s.active+1)%s.players.length;'
          new='const target=Array.from({length:s.players.length-1},(_,i)=>(s.active+i+1)%s.players.length).find(i=>s.players[i].hp===undefined||s.players[i].hp>0)??s.active;'
          if old in code: code=code.replace(old,new,1)
          elif new not in code: raise RuntimeError('Order target anchor missing')
          game.write_text(code,encoding='utf-8')
      - name: Validate game
        run: node --check watershallow.js
      - name: Commit installation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html watershallow.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Load complete combat expansion'
          git push origin HEAD:main
