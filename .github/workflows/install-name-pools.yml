name: Install expanded name pools
on:
  push:
    branches: [main]
    paths: ['name-pools.js', '.github/workflows/install-name-pools.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Validate names script
        run: node --check name-pools.js
      - name: Load name pools
        shell: python
        run: |
          from pathlib import Path
          page=Path('index.html')
          text=page.read_text(encoding='utf-8')
          if '</body>' not in text: raise RuntimeError('Missing body')
          tag='<script src="name-pools.js"></script>'
          if tag not in text: text=text.replace('</body>',tag+'</body>',1)
          page.write_text(text,encoding='utf-8')
      - name: Commit installation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Load expanded rival and card name pools'
          git push origin HEAD:main
