name: Install Harting art and distress map
on:
  push:
    branches: [main]
    paths: ['.github/workflows/install-1942-report-art.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Install Harting and update map
        shell: python
        run: |
          import io, re, zipfile
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.parse import urljoin, urlparse
          from urllib.request import Request, urlopen
          source = 'https://www.dafont.com/harting.font'
          def fetch(url):
              with urlopen(Request(url, headers={'User-Agent':'Mozilla/5.0'}), timeout=60) as r:
                  data = r.read(10000001)
              if len(data)>10000000: raise RuntimeError('Download too large')
              return data
          class Links(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.urls=[]
              def handle_starttag(self, tag, attrs):
                  if tag=='a':
                      url=urljoin(source,dict(attrs).get('href',''))
                      if urlparse(url).hostname=='dl.dafont.com': self.urls.append(url)
          links=Links()
          links.feed(fetch(source).decode('utf-8',errors='replace'))
          if not links.urls: raise RuntimeError('No DaFont download link found')
          archive=zipfile.ZipFile(io.BytesIO(fetch(links.urls[0])))
          matches=[x for x in archive.infolist() if Path(x.filename).name.lower()=='harting.ttf' and x.file_size<5000000]
          if len(matches)!=1: raise RuntimeError('Expected Harting.ttf')
          font=archive.read(matches[0])
          if font[:4] not in (bytes([0,1,0,0]),b'OTTO',b'true'): raise RuntimeError('Invalid font')
          page=Path('index.html')
          content=page.read_text()
          if '</head>' not in content: raise RuntimeError('Missing head')
          css="@font-face{font-family:'Harting';src:url('./fonts/harting/Harting.ttf') format('truetype');font-weight:400;font-style:normal;font-display:swap}pre,#terrain,.building-art,.sidebar-art,.menu pre,.compass{font-family:'Harting','Courier New',monospace!important;font-weight:400!important;font-synthesis:none;font-variant-ligatures:none;letter-spacing:0}"
          content=re.sub(r'<style id="ascii-art-font">.*?</style>','',content,flags=re.S)
          content=content.replace('</head>','<style id="ascii-art-font">'+css+'</style></head>',1)
          script=Path('watershallow.js')
          code=script.read_text()
          code,n=re.subn(r'<div class="sea-name"[^>]*>.*?</div>',lambda m:m[0].replace('🌊',''),code,count=1,flags=re.S)
          if n!=1: raise RuntimeError('Sea block not found')
          old="road?(Math.abs(v-.76)<.012?'=':'.')"
          new="road?(Math.abs(v-.76)<.012?'=- ~-.= -~'[(x*7+y*3)%10]:' .-~.  .- '[(x*5+y*7)%10])"
          if old in code: code=code.replace(old,new,1)
          elif new not in code: raise RuntimeError('Road expression not found')
          target=Path('fonts/harting')
          target.mkdir(parents=True,exist_ok=True)
          (target/'Harting.ttf').write_bytes(font)
          for i,item in enumerate(archive.infolist()):
              if not item.is_dir() and item.file_size<200000 and (Path(item.filename).suffix.lower() in ('.txt','.md') or Path(item.filename).name.lower() in ('license','licence','copying','ofl')):
                  (target/('upstream-'+str(i)+'-'+Path(item.filename).name)).write_bytes(archive.read(item))
          (target/'SOURCE.md').write_text('Harting by David Rakowski. Source: '+source+'. Preserve bundled notices; the game licence does not relicense this font.')
          page.write_text(content)
          script.write_text(code)
      - name: Validate JavaScript
        run: node --check watershallow.js
      - name: Commit installation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fonts/harting index.html watershallow.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Use Harting ASCII art, remove sea wave emoji and distress roads'
          git push origin HEAD:main
