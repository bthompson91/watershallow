name: Install Antraxja Goth headings
on:
  push:
    branches: [main]
    paths: ['.github/workflows/install-antraxja-goth.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Install heading font
        shell: python
        run: |
          import io,re,zipfile
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.parse import urljoin,urlparse
          from urllib.request import Request,urlopen
          source='https://www.dafont.com/antraxja-goth-1938.font'
          def fetch(url):
              with urlopen(Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=60) as r:
                  data=r.read(10000001)
              if len(data)>10000000: raise RuntimeError('Download too large')
              return data
          class Links(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.urls=[]
              def handle_starttag(self,tag,attrs):
                  if tag=='a':
                      url=urljoin(source,dict(attrs).get('href',''))
                      if urlparse(url).hostname=='dl.dafont.com': self.urls.append(url)
          links=Links()
          links.feed(fetch(source).decode('utf-8',errors='replace'))
          if not links.urls: raise RuntimeError('No DaFont download link')
          archive=zipfile.ZipFile(io.BytesIO(fetch(links.urls[0])))
          matches=[x for x in archive.infolist() if Path(x.filename).name.lower()=='gothica class 2.ttf' and x.file_size<5000000]
          if len(matches)!=1: raise RuntimeError('Expected gothica class 2.ttf')
          font=archive.read(matches[0])
          if font[:4] not in (bytes([0,1,0,0]),b'OTTO',b'true'): raise RuntimeError('Invalid font')
          page=Path('index.html')
          content=page.read_text(encoding='utf-8')
          if '</head>' not in content: raise RuntimeError('Missing head')
          content=re.sub(r'<style id="(?:dampfplatz-font|antraxja-goth-font)">.*?</style>','',content,flags=re.S)
          css="@font-face{font-family:'AntraxjaGoth1938';src:url('./fonts/antraxja-goth/gothica-class-2.ttf') format('truetype');font-style:normal;font-weight:400;font-display:swap}h1,h2,h3,.brand,.quay-title,.map-caption{font-family:'AntraxjaGoth1938',Georgia,serif!important;font-weight:400!important;font-synthesis:none}"
          content=content.replace('</head>','<style id="antraxja-goth-font">'+css+'</style></head>',1)
          target=Path('fonts/antraxja-goth')
          target.mkdir(parents=True,exist_ok=True)
          (target/'gothica-class-2.ttf').write_bytes(font)
          for i,item in enumerate(archive.infolist()):
              if not item.is_dir() and item.file_size<200000 and (Path(item.filename).suffix.lower() in ('.txt','.md') or Path(item.filename).name.lower() in ('license','licence','copying','ofl')):
                  (target/('upstream-'+str(i)+'-'+Path(item.filename).name)).write_bytes(archive.read(item))
          (target/'SOURCE.md').write_text('Antraxja Goth 1938 by Atrax. Source: '+source+'. Preserve upstream notices; the game licence does not relicense this font.',encoding='utf-8')
          page.write_text(content,encoding='utf-8')
      - name: Commit installation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fonts/antraxja-goth index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Replace DampfPlatz headings with Antraxja Goth'
          git push origin HEAD:main
