</style></head><body><div id="app"></div><p id="storage" class="warn" role="status"></p><script src="watershallow.js"></script><script src="emoji-atlas.js"></script><script>
/* Display-only changes: stable location IDs, rules and saves are unchanged. */
LOC.forEach(location=>{location[1]=location[1].replace(/^\d+\s*·\s*/, '');});
function expandHandCard(html){return html.replace('<details class="card">','<article class="card">').replace('<summary>','<h3>').replace('</summary>','</h3>').replace('</details>','</article>');}
const collapsibleCommission=commission,collapsibleOrder=orderCard;
commission=function(...args){return expandHandCard(collapsibleCommission(...args));};
orderCard=function(...args){return expandHandCard(collapsibleOrder(...args));};
function fitHands(){
  const hand=document.querySelector('.hand');if(!hand)return;
  const panels=[...hand.querySelectorAll(':scope>.stack')];if(!panels.length)return;
  const style=getComputedStyle(hand),gap=parseFloat(style.rowGap)||0;
  const available=Math.max(0,hand.clientHeight-(parseFloat(style.paddingTop)||0)-(parseFloat(style.paddingBottom)||0)-gap*(panels.length-1));
  const desired=panels.map(panel=>{const heading=panel.querySelector('h2'),list=panel.querySelector('.scroll'),hs=getComputedStyle(heading);return Math.ceil(heading.getBoundingClientRect().height+(parseFloat(hs.marginTop)||0)+(parseFloat(hs.marginBottom)||0)+list.scrollHeight+2);});
  let heights=desired;
  if(desired.reduce((a,b)=>a+b,0)>available){
    const floor=Math.min(100,available/panels.length),base=desired.map(d=>Math.min(d,floor));
    const remaining=Math.max(0,available-base.reduce((a,b)=>a+b,0)),need=desired.map((d,i)=>Math.max(0,d-base[i])),total=need.reduce((a,b)=>a+b,0);
    heights=base.map((v,i)=>v+(total?remaining*need[i]/total:0));
  }
  panels.forEach((panel,i)=>{panel.style.height=Math.max(0,heights[i])+'px';});
}
let observedHand=null;
const handObserver=new ResizeObserver(fitHands);
const renderBeforeHandLayout=render;
render=function(){
  renderBeforeHandLayout();
  const hand=document.querySelector('.hand');
  if(hand!==observedHand){handObserver.disconnect();observedHand=hand;if(hand)handObserver.observe(hand);}
  if(!s||!hand)return;
  const human=s.players[0],eligible=human.mandatory.length?human.mandatory:human.q;
  const affordable=eligible.some(q=>can(human,q.cost)),ready=isHuman()&&s.step==='quest'&&affordable;
  const button=document.querySelector('.foot button[data-act="end"]');
  if(button)button.textContent=ready?'[ Skip commission / End turn ]':'[ End turn ]';
  const panel=hand.querySelector('.stack'),heading=panel.querySelector('h2');
  panel.classList.toggle('commission-affordable',affordable);
  if(affordable){const badge=document.createElement('span');badge.className='commission-badge';badge.textContent=ready?'✓ READY':'✓ AFFORDABLE';heading.appendChild(badge);}
  fitHands();
};
render();
</script><script>if(document.fonts&&typeof fitHands==='function'){document.fonts.ready.then(fitHands);document.fonts.addEventListener('loadingdone',fitHands);}</script><script data-lt-cushion-fit>if(document.fonts&&typeof fitHands==='function'){document.fonts.ready.then(fitHands);document.fonts.addEventListener('loadingdone',fitHands);}</script></body></html>
