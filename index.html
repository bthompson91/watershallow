<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kings of Watershallow</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;height:100%;background:#0e1b23;color:#eee8d6;font:14px/1.35 system-ui,sans-serif}body{padding:8px}button,input,select{font:inherit;color:inherit;background:#25404a;border:1px solid #678781;border-radius:5px;padding:6px 9px}button{cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}button:hover:not(:disabled){background:#3a5f62}button:focus-visible,summary:focus-visible{outline:3px solid #ffe29c}h1,h2,h3,p{margin:0}h2{font-size:15px;color:#e8cf8b;margin-bottom:6px}h3{font-size:14px;color:#e8cf8b}.small{font-size:12px;color:#b6cac6}.warn{color:#ffd080}#app{max-width:1800px;height:min(800px,calc(100dvh - 16px));margin:auto;display:flex;flex-direction:column;gap:8px;min-height:0}.top{display:flex;align-items:center;gap:16px;padding:9px 12px;border:1px solid #718471;border-radius:7px;background:#192f38;flex:none;min-height:58px}.brand{font-weight:700;color:#f1d18a;white-space:nowrap}.resources{display:flex;flex-wrap:wrap;gap:6px}.chip{padding:3px 6px;background:#10252e;border-radius:4px;white-space:nowrap}.body{display:grid;grid-template-columns:175px minmax(0,1fr) 340px;gap:8px;flex:1;min-height:0}.panel{background:#192e37;border:1px solid #415e63;border-radius:6px;padding:10px;min-width:0;min-height:0}.sidebar{overflow:auto}.rival{border-bottom:1px solid #486166;padding:8px 0}.active{color:#ffe29b}.board{display:flex;flex-direction:column;min-height:0;gap:7px;background:linear-gradient(100deg,#153f51 0 6%,#344535 6% 98%,#203b35 98%);padding:10px 12px 8px 26px;border:1px solid #789374;border-radius:7px}.map-title{font:700 12px monospace;letter-spacing:3px;text-align:center;color:#d9d6a6}.district{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));gap:10px 16px;flex:1;min-height:0;position:relative}.district:before{content:'====+====+====+====';position:absolute;inset:0;text-align:center;white-space:pre;color:#c2bc83;opacity:.2;pointer-events:none;font:30px monospace;background:repeating-linear-gradient(0deg,transparent 0 31%,#c4b98a66 31% 32%,transparent 32% 64%,#c4b98a66 64% 65%,transparent 65%)}.place{position:relative;display:flex;flex-direction:column;justify-content:center;gap:4px;padding:7px;background:#152b2bef;border:1px solid #94a881;border-radius:6px;min-width:0;min-height:0;overflow:auto}.spaces{display:flex;gap:4px;flex-wrap:wrap}.spaces button{flex:1;min-width:0;font-size:12px;padding:6px 4px;min-height:30px;border-color:#a2c69a;background:#2b4b3d}.spaces button.occupied{background:#4c353e;border-color:#ac7c86;opacity:.85}.reward{font-size:12px;color:#d3debd}.quay{height:130px;flex:none;overflow:auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;align-content:start}.quay .place{min-height:108px}.hand{display:grid;grid-template-rows:minmax(0,1.5fr) minmax(0,1fr);gap:8px;min-height:0}.stack{display:flex;flex-direction:column;min-height:0}.scroll{overflow:auto;min-height:0;flex:1}.card{padding:7px;border:1px solid #536c6c;border-radius:5px;margin:5px 0;background:#142932}.card summary{cursor:pointer;font-size:13px}.card p{margin:5px 0}.card button{margin-top:5px}.foot{height:42px;display:flex;align-items:center;gap:8px;flex:none}.latest{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}.primary{background:#47643c;border-color:#c4d593}.shade{position:fixed;inset:0;background:#000b;z-index:5;display:grid;place-items:center;padding:20px}.modal{background:#1b323c;border:2px solid #b9a676;border-radius:9px;padding:20px;width:min(740px,95vw);max-height:85dvh;overflow:auto;box-shadow:0 15px 70px #0009}.modal h2{font-size:22px}.modal-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.menu{max-width:600px;margin:auto;width:100%}.menu label{display:block;margin:12px 0}.menu input,.menu select{margin-left:12px}#storage{position:fixed;bottom:1px;left:10px;font-size:11px;z-index:9}.hint{margin:10px 0!important}@media(max-width:1100px){html,body{height:auto}#app{height:auto;min-height:calc(100dvh - 16px)}.body{grid-template-columns:150px minmax(0,1fr)}.board{min-height:650px}.hand{grid-column:1/-1;grid-template-columns:1fr 1fr;grid-template-rows:320px}.top{flex-wrap:wrap}.sidebar{max-height:650px}}@media(max-width:650px){.body{display:flex;flex-direction:column}.board{min-height:740px;padding-left:10px}.sidebar{max-height:200px}.hand{display:flex;flex-direction:column}.stack{height:300px}.top{gap:6px}.district{gap:6px}.spaces{flex-direction:column}.modal-grid{grid-template-columns:1fr}.foot{height:auto;flex-wrap:wrap}}
</style></head><body><div id="app"></div><p id="storage" class="warn" role="status"></p><script>
'use strict';
const KEY='watershallow-v2',TYPES=['guards','scouts','healers','mages'],ICON={gold:'🪙',guards:'🛡️',scouts:'🗡️',healers:'🌿',mages:'🔮'},CATEGORIES=['Guardians','Explorers','Mystics','Diplomats','Traders'];
const $=id=>document.getElementById(id),esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let s=null,timer=null,view=null;
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function res(x){return Object.entries(x).filter(([k,v])=>v&&ICON[k]).map(([k,v])=>`${ICON[k]} ${v} ${k}`).join(' · ')||'—'}
function can(p,c){return Object.entries(c).every(([k,v])=>p.r[k]>=v)}
function gain(p,r){for(const k in r)p.r[k]+=r[k]}
function pay(p,c){for(const k in c)p.r[k]-=c[k]}
function say(t){s.log.unshift(t);s.log=s.log.slice(0,100)}
function save(){try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){$('storage').textContent='Saving unavailable; session play still works.'}}
function read(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}
function quests(){const names=['Chart the Glass Reefs','Escort the Winter Caravan','Recover the Bell of Dawn','Secure the Salt Road','Light the Outer Beacons','Rescue the Marsh Pilgrims','Seal the Whispering Well','Survey the Moon Caves','Defend the Amber Ferry','Recover the Lost Almanac','Supply the Cliff Settlement','Break the Smuggler Ring'];return Array.from({length:60},(_,i)=>{let a=i%4,b=(i+1)%4,n=2+i%3;return{id:'q'+i,name:names[i%12]+' '+(1+Math.floor(i/12)),kind:i%5,cost:{[TYPES[a]]:n,[TYPES[b]]:1,gold:i%3},vp:5+n*2+i%3,plot:i%10===0?TYPES[a]:null}})}
function buildings(){return Array.from({length:18},(_,i)=>({id:'b'+i,name:['Watch Pier','Lantern Hospice','Glass Observatory','Sailmakers Hall','Reef Exchange','Seafarers Lodge'][i%6]+' '+(1+Math.floor(i/6)),cost:4+i%5,vp:0,reward:i%6<4?{[TYPES[i%4]]:2}:{gold:4+i%2},bonus:i%6<4?{[TYPES[i%4]]:1}:{gold:2},owner:null}))}
function orders(){return Array.from({length:50},(_,i)=>({id:'o'+i,kind:i%5,name:['Harbour Purse','Quiet Recruitment','Shared Expedition','Unwelcome Duty','Supply Seizure'][i%5]}))}
const LOC=[['guards','1 · Barracks',{guards:2}],['scouts','2 · Lantern Alley',{scouts:2}],['healers','3 · Grove Shrine',{healers:1}],['mages','4 · Star Tower',{mages:1}],['gold','5 · Treasury',{gold:4}],['foundry','6 · Foundry',{}],['council','7 · Tide Council',{}],['guild','8 · Commission Guild',{}],['harbour','9 · Moon Harbour',{}]];
function fresh(){clearTimeout(timer);view=null;const n=Number($('rivals').value)+1,initial=n===2?4:n===3?3:2,names=[$('name').value.trim()||'Captain','Mira','Vane','Reed','Ash'];s={v:2,round:1,phase:'start',active:0,first:0,step:'place',deck:shuffle(quests()),market:[],bd:shuffle(buildings()),bm:[],built:[],od:shuffle(orders()),discard:[],used:{},harbour:[],hi:0,log:[],players:Array.from({length:n},(_,i)=>({name:names[i],ai:i>0,r:{gold:4+i,guards:0,scouts:0,healers:0,mages:0},agents:initial,left:initial,score:0,q:[],hand:[],plots:[],done:[],mandatory:[],agenda:shuffle([0,1,2,3,4]).slice(0,2)}))};for(const p of s.players){p.q.push(s.deck.pop(),s.deck.pop());p.hand.push(drawOrder(),drawOrder())}for(let i=0;i<4;i++)s.market.push(s.deck.pop());for(let i=0;i<3;i++)s.bm.push(s.bd.pop());startRound();render()}
function drawOrder(){if(!s.od.length)s.od=shuffle(s.discard.splice(0));return s.od.pop()||null}
function giveOrder(p){const o=drawOrder();if(o)p.hand.push(o)}
function startRound(){s.phase='start';s.step='place';s.active=s.first;s.used={};s.harbour=[];s.hi=0;for(const b of s.bm)b.vp++;for(const p of s.players){if(s.round===5)p.agents++;p.left=p.agents}s.roundBase=s.players.map(p=>p.score);say('🌅 Round '+s.round+' begins'+(s.round===5?' — everyone gains an agent!':''));save()}
function available(){let a=[];for(const [id] of LOC){let count=id==='guild'||id==='harbour'?3:1;for(let i=0;i<count;i++){let key=id+':'+i;if(!Object.hasOwn(s.used,key)&&!(s.phase==='harbour'&&id==='harbour'))a.push(key)}}for(const b of s.built)if(!Object.hasOwn(s.used,b.id+':0'))a.push(b.id+':0');return a}
function actor(){return s.players[s.active]}
function begin(){view=null;if(s.phase==='start')s.phase='placement';else if(s.phase==='end'){if(s.round===8){scoreFinal();render();return}s.round++;startRound();render();return}save();render()}
function selectSpace(key){if(!available().includes(key)||s.step!=='place')return;let p=actor(),[id,num]=key.split(':');if(id==='harbour'&&!p.hand.length)return;if(s.phase==='placement'&&p.left<=0)return;view=null;s.used[key]=s.active;if(s.phase==='placement')p.left--;say(p.name+' visits '+label(id)+(id==='guild'||id==='harbour'?' space '+(Number(num)+1):''));if(s.phase==='placement'&&id==='harbour')s.harbour.push({player:s.active,key});s.pending=key;if(id==='guild')s.step='guild';else if(id==='foundry')s.step='build';else if(id==='harbour')s.step='order';else{if(id==='council'){s.first=s.active;giveOrder(p)}else{let b=s.built.find(x=>x.id===id);if(b){gain(p,b.reward);if(b.owner!==s.active)gain(s.players[b.owner],b.bonus)}else gain(p,LOC.find(x=>x[0]===id)[2])}s.step='quest'}save();render()}
function label(id){return LOC.find(x=>x[0]===id)?.[1]||s.built.find(b=>b.id===id)?.name||id}
function takeQuest(i){if(s.step!=='guild'||!s.market[i])return;const p=actor(),num=Number(s.pending.split(':')[1]);p.q.push(s.market[i]);s.market.splice(i,1);if(s.deck.length)s.market.push(s.deck.pop());if(num===0)gain(p,{gold:2});if(num===1)giveOrder(p);s.step='quest';view=null;save();render()}
function refreshMarket(){if(s.step!=='guild'||s.pending!=='guild:2')return;for(let i=s.market.length;i>0;i--){s.market.shift();if(s.deck.length)s.market.push(s.deck.pop())}save();render()}
function buy(i){if(s.step!=='build')return;const b=s.bm[i],p=actor();if(!b||p.r.gold<b.cost)return;p.r.gold-=b.cost;p.score+=b.vp;b.owner=s.active;s.built.push(b);s.bm.splice(i,1);if(s.bd.length)s.bm.push(s.bd.pop());say(p.name+' constructs '+b.name+' (+'+b.vp+' VP)');s.step='quest';view=null;save();render()}
function playOrder(i){if(s.step!=='order')return;const p=actor(),o=p.hand[i];if(!o)return;p.hand.splice(i,1);s.discard.push(o);const target=(s.active+1)%s.players.length;if(o.kind===0)gain(p,{gold:4});if(o.kind===1)gain(p,{[TYPES[s.round%4]]:2});if(o.kind===2){gain(p,{guards:2,mages:1});gain(s.players[target],{guards:1})}if(o.kind===3)s.players[target].mandatory.push({id:o.id+'-'+s.round,cost:{guards:1,scouts:1},name:'Urgent quay repairs',vp:2});if(o.kind===4){const q=s.players[target],k=TYPES.find(k=>q.r[k]>0);if(k){q.r[k]--;p.r[k]++}else p.r.gold+=2}say(p.name+' plays '+o.name);s.step='quest';view=null;save();render()}
function complete(i,mandatory=false){if(s.step!=='quest')return;const p=actor(),list=mandatory?p.mandatory:p.q,q=list[i];if(!q||!can(p,q.cost)||(!mandatory&&p.mandatory.length))return;pay(p,q.cost);p.score+=q.vp;list.splice(i,1);if(!mandatory){p.done.push(q.kind);if(q.plot)p.plots.push(q.plot);gain(p,{gold:2});for(const k of p.plots)gain(p,{[k]:1})}say(p.name+' completes '+q.name+' (+'+q.vp+' VP)');s.step='done';view=null;save();render()}
function endTurn(){if(!['quest','done','build','guild'].includes(s.step))return;view=null;s.step='place';delete s.pending;if(s.phase==='harbour'){s.hi++;nextHarbour()}else{let found=false;for(let k=1;k<=s.players.length;k++){let i=(s.active+k)%s.players.length;if(s.players[i].left>0){s.active=i;found=true;break}}if(!found){s.phase='harbour';s.harbour.sort((a,b)=>Number(a.key.split(':')[1])-Number(b.key.split(':')[1]));s.hi=0;nextHarbour()}}save();render()}
function nextHarbour(){if(s.hi>=s.harbour.length){s.phase='end';say('🌙 Round '+s.round+' complete');return}const h=s.harbour[s.hi];s.active=h.player;delete s.used[h.key];s.step='place';say(actor().name+' reassigns harbour agent '+(s.hi+1))}
function scoreFinal(){for(const p of s.players){p.final={adventurers:TYPES.reduce((n,k)=>n+p.r[k],0),gold:Math.floor(p.r.gold/2),agenda:p.done.filter(k=>p.agenda.includes(k)).length*4};p.total=p.score+p.final.adventurers+p.final.gold+p.final.agenda}s.phase='over';save()}
function ai(){if(!s||!actor().ai||!['placement','harbour'].includes(s.phase))return;const p=actor();if(s.step==='place'){let a=available().filter(k=>!k.startsWith('harbour:')||p.hand.length);if(!a.length){s.step='quest';render();return}let need={gold:0,guards:0,scouts:0,healers:0,mages:0};const goals=p.mandatory.length?p.mandatory:p.q;let goal=[...goals].sort((a,b)=>deficit(p,a)-deficit(p,b))[0];if(goal)for(const k in goal.cost)need[k]=Math.max(0,goal.cost[k]-p.r[k]);let ranked=a.map(key=>{let id=key.split(':')[0],r=LOC.find(l=>l[0]===id)?.[2]||s.built.find(b=>b.id===id)?.reward||{};let v=Object.entries(r).reduce((n,[k,x])=>n+x*(need[k]>0?3:0.3),0);if(id==='guild')v=p.q.length?0.1:10;if(id==='harbour')v=2;if(id==='foundry')v=s.bm.some(b=>b.cost<=p.r.gold)?1.8:-1;if(id==='council')v=0.5;return{key,v:v+Math.random()*.2}}).sort((a,b)=>b.v-a.v);selectSpace(ranked[0].key)}else if(s.step==='guild'){if(s.market.length)takeQuest(0);else endTurn()}else if(s.step==='build'){let i=s.bm.findIndex(b=>b.cost<=p.r.gold);if(i>=0)buy(i);else endTurn()}else if(s.step==='order')playOrder(0);else if(s.step==='quest'){let list=p.mandatory.length?p.mandatory:p.q,i=list.findIndex(q=>can(p,q.cost));if(i>=0)complete(i,!!p.mandatory.length);else endTurn()}else endTurn()}
function deficit(p,q){return Object.entries(q.cost).reduce((n,[k,v])=>n+Math.max(0,v-p.r[k]),0)}

const ORDER_TEXT=['Gain 4 coins.','Gain 2 adventurers of this round\'s recruitment type.','Gain 2 guards and 1 mage; next rival gains 1 guard.','Next rival receives a mandatory duty: 1 guard + 1 scout for 2 VP.','Take an adventurer from next rival, or gain 2 coins if they have none.'];
function btn(text,a,disabled=false){return `<button data-act="${a}" ${disabled?'disabled':''}>${text}</button>`}
function isHuman(){return s.active===0&&!actor().ai}
function commission(q,i,m=false){const h=s.players[0],ok=isHuman()&&s.step==='quest'&&can(h,q.cost)&&(m||!h.mandatory.length);return `<details class="card"><summary>${m?'⚠️ ':q.plot?'♾️ ':'📜 '}${esc(q.name)} · ${q.vp} VP</summary><p class="small">${m?'Mandatory':CATEGORIES[q.kind]}</p><p>${res(q.cost)}</p><p>Reward: ${q.vp} VP${m?'':' + 2 coins'}</p>${q.plot?'<p>Ongoing: +1 '+q.plot+' after each commission, including this one.</p>':''}${btn('Complete',`quest,${i},${m?1:0}`,!ok)}</details>`}
function orderCard(o,i){return `<details class="card"><summary>🗂️ ${esc(o.name)}</summary><p>${ORDER_TEXT[o.kind]}</p>${btn('Play Order','order,'+i,!isHuman()||s.step!=='order')}</details>`}
function city(){const av=available(),p=actor();function spaces(id,n){return '<div class="spaces">'+Array.from({length:n},(_,i)=>{const key=id+':'+i,taken=Object.hasOwn(s.used,key),text=taken?'● '+esc(s.players[s.used[key]].name):id==='guild'?['○ +2🪙','○ +Order','○ Refresh'][i]:id==='harbour'?'○ Berth '+(i+1):'○ Assign';return `<button class="${taken?'occupied':''}" aria-label="${esc(label(id))}, space ${i+1}${taken?', occupied':', assign agent'}" data-act="space,${key}" ${!isHuman()||s.step!=='place'||!av.includes(key)||(id==='harbour'&&!p.hand.length)?'disabled':''}>${text}</button>`}).join('')+'</div>'}
const order=['guards','gold','mages','scouts','council','healers','guild','harbour','foundry'];return `<div class="map-title">~ NORTH WARD · WATERSHALLOW ~</div><div class="district">${order.map(id=>{const [,name,r]=LOC.find(x=>x[0]===id),text={guild:'Acquire a commission',harbour:'Play Order; reassign later',council:'First player + draw Order',foundry:'Buy a shared building'}[id]||res(r);return `<section class="place"><h3>${name}</h3><div class="reward">${text}</div>${spaces(id,id==='guild'||id==='harbour'?3:1)}</section>`}).join('')}</div><div class="map-title">==== SOUTH QUAY · BUILDING PLOTS ====</div><div class="quay">${s.built.map(b=>`<section class="place"><h3>${esc(b.name)}</h3><div class="small">${esc(s.players[b.owner].name)} · Owner ${res(b.bonus)}</div><div class="reward">Visit ${res(b.reward)}</div>${spaces(b.id,1)}</section>`).join('')||'<p class="small">No buildings yet. Construct at the Foundry.</p>'}</div>`}
function marketHTML(live){return s.bm.map((b,i)=>`<div class="card"><h3>${esc(b.name)}</h3><p>${b.cost} 🪙 · ${b.vp} accumulated VP</p><p>Visit: ${res(b.reward)}<br>Owner: ${res(b.bonus)}</p>${btn('Construct','buy,'+i,!live||s.players[0].r.gold<b.cost)}</div>`).join('')}
function modal(title,body,close=true){return `<div class="shade"><section class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><h2>${title}</h2>${body}${close?btn('Close','close'):''}</section></div>`}
function overlays(){const h=s.players[0];if(s.phase==='start'||s.phase==='end'){let start=s.phase==='start';return modal(start?'🌅 Round '+s.round+' / 8':'🌙 Round '+s.round+' complete',`<p class="hint">${start?'Agents recalled; spaces reopened; building market gains one VP per card.':'Normal placement and harbour reassignment are finished.'}</p>${start&&s.round===5?'<h3>Everyone gains an additional agent!</h3>':''}<p class="hint">Starting player: ${esc(s.players[s.first].name)}</p>${!start?s.players.map((p,i)=>`<p>${esc(p.name)}: ${p.score} VP (+${p.score-s.roundBase[i]} this round)</p>`).join(''):''}<p class="hint">${btn(start?'Begin round':s.round===8?'View final scores':'Continue to next round','begin')}</p>`,false)}
if(isHuman()&&s.step==='guild')return modal('Commission Guild',`<p class="hint">Choose one public commission to acquire.</p>${s.pending==='guild:2'?btn('Refresh market','refresh'):''}<div class="modal-grid">${s.market.map((q,i)=>`<div class="card"><h3>${esc(q.name)}</h3><p>${CATEGORIES[q.kind]} · ${q.vp} VP</p><p>${res(q.cost)}</p>${btn('Acquire','take,'+i)}</div>`).join('')}</div>${btn('Skip acquisition / end turn','end')}`,false);
if(isHuman()&&s.step==='build')return modal('Foundry — construct a building',`<div class="modal-grid">${marketHTML(true)}</div>${btn('Skip construction / end turn','end')}`,false);
if(view==='market')return modal('Building market',`<div class="modal-grid">${marketHTML(false)}</div>`);
if(view==='log')return modal('Public event history',s.log.map(x=>'<p class="hint">'+esc(x)+'</p>').join(''));
if(view==='help')return modal('Rules / settings',`<p class="hint">Assign one agent on the map. Resolve the action, optionally complete one owned commission, then end turn. Harbour spaces require an Order and let the agent act again during reassignment. Round five adds an agent. End scoring adds adventurers, half your gold (rounded down), and agenda bonuses.</p><p class="hint">Your hand always stays visible; rival unplayed cards and agendas are hidden. Their public actions appear in the log. Hidden information is a UI convention in this local single-player game, not encrypted from developer tools.</p><p class="hint">Original cards, city and implementation; some effects and balance differ from other games. MIT code. V2 saves supported.</p>${btn('Save','save')} ${btn('Return to menu','reset')}`);
return ''}
function render(){clearTimeout(timer);const scrolls={};document.querySelectorAll('[data-scroll]').forEach(e=>scrolls[e.dataset.scroll]=e.scrollTop);const opened=[...document.querySelectorAll('details[open]')].map(e=>e.querySelector('summary')?.textContent);if(!s){$('app').innerHTML=`<section class="menu panel"><h1>👑 ⚓ Kings of Watershallow</h1><label>Name <input id="name" maxlength="24" value="Captain"></label><label>AI rivals <select id="rivals"><option>1</option><option selected>2</option><option>3</option><option>4</option></select></label>${btn('Begin voyage','new')} ${btn('Continue','load',!read())}<p class="hint small">Compact board · local autosave · original worker-placement game</p></section>`;return}
if(s.phase==='over'){$('app').innerHTML=`<div class="panel scroll"><h2>🏆 Final standings</h2>${[...s.players].sort((a,b)=>b.total-a.total||b.r.gold-a.r.gold).map((p,i)=>`<div class="card"><h3>${i+1}. ${esc(p.name)} — ${p.total} VP</h3><p>During play ${p.score} · Adventurers ${p.final.adventurers} · Coins ${p.final.gold} · Agenda ${p.final.agenda}</p><p>Agenda: ${p.agenda.map(k=>CATEGORIES[k]).join(' + ')}</p></div>`).join('')}${btn('New voyage','reset')}</div>`;return}
const h=s.players[0],p=actor(),ready=isHuman()&&['quest','done','guild','build'].includes(s.step),hint=p.ai?'🤖 '+p.name+' is acting':s.step==='place'?'Assign an agent on the city map':s.step==='order'?'Play an Order from your hand':s.step==='quest'?'Complete one commission, or end turn':s.step==='done'?'Commission resolved — end turn':'Resolve '+s.step;
$('app').innerHTML=`<header class="top"><div class="brand">👑 Watershallow<br><span class="small">Round ${s.round}/8 · ${s.phase}</span></div><div class="resources">${Object.entries(h.r).map(([k,v])=>`<span class="chip">${ICON[k]} ${v} ${k}</span>`).join('')}</div><div class="chip">⭐ ${h.score} VP · Agents ${h.left}/${h.agents}</div></header><main class="body"><aside class="panel sidebar"><h2>Harbour rivals</h2>${s.players.map((x,i)=>`<div class="rival ${i===s.active?'active':''}"><h3>${i===s.active?'▶ ':''}${esc(x.name)}</h3><p>${x.score} VP · ${x.left}/${x.agents} agents</p><p class="small">${x.q.length} commissions<br>${x.hand.length} Orders · ${x.mandatory.length} duties</p></div>`).join('')}<h2 class="hint">Your agenda</h2><p>${h.agenda.map(k=>CATEGORIES[k]).join(' + ')}</p><p class="small">+4 VP per matching completed commission.</p><p class="hint">${btn('Building market','market')}${btn('Rules / settings','help')}</p></aside><section class="board" aria-label="Interactive city map">${city()}</section><aside class="hand"><section class="panel stack"><h2>Your commissions (${h.q.length})</h2><div class="scroll" data-scroll="quests">${h.mandatory.map((q,i)=>commission(q,i,true)).join('')}${h.q.map((q,i)=>commission(q,i)).join('')||'<p class="small">Acquire commissions at the Guild.</p>'}</div></section><section class="panel stack"><h2>Your Orders (${h.hand.length})</h2><div class="scroll" data-scroll="orders">${h.hand.map(orderCard).join('')||'<p class="small">Draw Orders at the Council.</p>'}</div></section></aside></main><footer class="foot"><button class="latest" data-act="log" title="Open public event history">${esc(s.log[0]||'Voyage begins')}</button><span class="small">${esc(hint)}</span><button class="primary" data-act="end" ${ready?'':'disabled'}>${s.step==='quest'?'Skip commission / End turn':'End turn'}</button>${btn('⚙','help')}</footer>${overlays()}`;
document.querySelectorAll('[data-scroll]').forEach(e=>e.scrollTop=scrolls[e.dataset.scroll]||0);document.querySelectorAll('details').forEach(e=>{if(opened.includes(e.querySelector('summary')?.textContent))e.open=true});save();if(p.ai&&['placement','harbour'].includes(s.phase))timer=setTimeout(ai,450)}
document.addEventListener('click',e=>{const b=e.target.closest('button[data-act]');if(!b||b.disabled)return;const[a,x,y]=b.dataset.act.split(',');try{if(a==='new')fresh();else if(a==='load'){s=read();view=null;if(s?.v!==2)s=null;render()}else if(a==='reset'){if(confirm('Return to menu? Current voyage remains saved until you start a new one.')){clearTimeout(timer);s=null;view=null;render()}}else if(a==='begin')begin();else if(a==='save'){save();$('storage').textContent='Voyage saved.'}else if(['market','log','help','close'].includes(a)){view=a==='close'?null:a;render()}else if(s&&isHuman()){if(a==='space')selectSpace(x);if(a==='take')takeQuest(+x);if(a==='refresh')refreshMarket();if(a==='buy')buy(+x);if(a==='order')playOrder(+x);if(a==='quest')complete(+x,y==='1');if(a==='end')endTurn()}}catch(err){$('storage').textContent='Unexpected error: '+err.message;console.error(err)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&view){view=null;render()}});
render();
</script></body></html>
